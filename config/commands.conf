# scribbolyth keymap & command configuration
#
# One entry per line:  mode  key  repeat  command  args  op  description
#
#   mode     TREE | NORMAL | INSERT | VISUAL  binds `key` in that mode.
#            GLOBAL                           registers a command only (no key).
#
#   key      a single character (j, :, 0, $), a special token
#            (Esc, Return, Tab, Backspace, Space,
#             ArrowUp, ArrowDown, ArrowLeft, ArrowRight,
#             PageUp, PageDown, Home, End), or a quoted multi-key
#            sequence like "g g".  '-' means no key binding.
#
#   repeat   yes | no  whether the key accepts a count prefix (3 j).
#
#   command  optional ':name' usable from the command line.
#            '-' means the entry has no command-line access.
#            When args is 'prompt', this name is also what gets
#            prepopulated in the command field when the key is pressed.
#
#   args     -         no arguments are passed.
#            prompt    the key opens the command line with ':command '
#                      already typed so you can enter the arguments.
#                      Requires `command` to be set.
#            <text>    passed verbatim to the function.
#
#   op       the operation name the loader dispatches on.  If `command`
#            is '-', the operation is reachable ONLY through the key; if
#            `command` is set, it can also be run as ':command [args]'.
#
#   description  the user-facing text shown in the '?' help dialog.
#            Quote it when it contains spaces:  "Move cursor up".
#            Optionally follow it with '|' and a longer help topic:
#            "Short text"|"Full topic".  Press Enter on the binding in
#            the '?' dialog to read the topic; Escape returns to the
#            list.  In the topic, \n starts a new line and \t adds
#            four spaces.
#
# Lines starting with '#' and blank lines are ignored.

# ---- TREE mode ------------------------------------------------------------
# MODE            KEY          REP   CMD             ARGS    OP                            DESC
  TREE            ArrowUp      yes   -               -       move_up                       "Move selection up"|"This is an alternative to the:\n\tj\n\tk navigation key bindings."
  TREE            ArrowDown    yes   -               -       move_down                     "Move selection down"|"This is an alternative to the:\n\tj\n\tk navigation key bindings."
  TREE            k            yes   -               -       move_up                       "Move selection up"|"Moves the cursor up within the current node's contents.\n[count] [key binding] - repeats the action."
  TREE            j            yes   -               -       move_down                     "Move selection down"|"Moves the cursor down within the current node's contents.\n[count] [key binding] - repeats the action."
  TREE            G            no    -               -       move_file_end                 "Jump to last node"|"Moves the node selection to the bottom-most node within the tree."
  TREE            "g g"        no    -               -       move_file_start               "Jump to first node"|"Moves the node selection to the top-most node within the tree."
  TREE            Return       yes   -               -       tree_open                     "Open selected node"|"Toggle the expanded state of the current node, if it contains child nodes."
  TREE            h            yes   -               -       tree_collapse                 "Collapse selected node"|"Collapse the current node if it is expanded. If the current node is not expanded or does not have child nodes, the node selection moves to the next outer node.\nIt moves 'left' within the tree - up into the parent node.\n[count] [key binding] - repeats the action."
  TREE            l            yes   -               -       tree_expand                   "Expand selected node"|"Expand if the current node has child nodes and is not expanded. If the current node is expanded and has child nodes, the node selection moves into that node selecting its first child node.\nIt moves 'right' within the tree - down into the current node.\n[count] [key binding] - repeats the action."
  TREE            E            no    -               -       expand_all                    "Expand all nodes"|"Expand all of the nodes within the tree that contain child nodes, recursively."
  TREE            e            no    -               -       expand_branch                 "Expand the selected node and all of its children"|"Expand all of the child nodes within the currently selected node, recursively."
  TREE            C            no    -               -       collapse_all                  "Collapse all nodes"|"Collapse all of the nodes within the tree that contain child nodes, recursively."
  TREE            A            no    create_child    prompt  new_child                     "Add a child to the selected node (root if no node selected)"|"Create a new node as a child node of the currently selected node. If no node is selected (accomplished by hitting Escape when in TREE mode), it is created as a root level node."
  TREE            a            no    create_node     prompt  new_node                      "Add a new node (root if no node selected)"|"Create a new node as a sibling node of the currently selected node. If no node is selected (accomplished by hitting Escape when in TREE mode), it is created as a root level node."
  TREE            R            no    rename          prompt  rename_node                   "Rename selected node"|"Renames the currently selected node, utilizing the command input. If no node is selected this has no effect."
  TREE            D            no    -               -       delete_node                   "Delete selected node"|"Deletes the currently selected node, as well as any child nodes that it contains, recursively. If no node is selected this has no effect."
  TREE            i            no    -               -       enter_normal                  "Switch to NORMAL mode"|"Switches to NORMAL mode for navigation and modification of the currently selected node's contents.\nRegular typing is not done in this mode.\nIf no node is selected this has no effect."
  TREE            t            no    export_note_txt prompt  export_note_txt               "Export current note as .txt"|"Export the currently selected node's contents to a .txt file. If no node selected nothing is saved.\n\nNote:\nDirectories can be bookmarked using: m\nTo access bookmarked directories use: `"
  TREE            T            no    export_tree_txt prompt  export_tree_txt               "Export current tree branch as .txt"|"Export the currently selected node's contents and all of its child nodes' contents recursively, to a .txt file. If no node is selected nothing is saved.\n\nNote:\nDirectories can be bookmarked using: m\nTo access bookmarked directories use: `"
  TREE            I            no    -               -       enter_insert                  "Switch to INSERT mode"|"Switches to the INSERT mode, this is where standard typing content into a node is done."
  TREE            :            no    -               -       enter_command                 "Open the command line"|"Displays the command input and gives it focus."
  TREE            J            yes   -               -       move_node_down                "Move selected node down"|"Moves the currently selected node toward the bottom of the tree.\nNote that this is upper case.\n[count] [key binding] - repeats the action."
  TREE            K            yes   -               -       move_node_up                  "Move selected node up"|"Moves the current node toward the top of the tree.\nNote that this is upper case.\n[count] [key binding] - repeats the action."
  TREE            H            yes   -               -       move_parent_up                "Move selected node up a level"|"Moves the current node up one level 'left' (if possible) within the tree.\nNote that this is upper case.\n[count] [key binding] - repeats the action."
  TREE            L            yes   -               -       move_parent_down              "Move selected node down a level"|"Moves the current node down one level 'right' (if possible) within the tree.\nNote that this is upper case.\n[count] [key binding] - repeats the action."
  TREE            S            no    saveas          prompt  saveas                        "Save the document as..."|"Save as is done within the command input.\nThis allows you to save the current file in a different location or with a different name.\n\nNote:\nDirectories can be bookmarked using: m\nTo access bookmarked directories use: `"
  TREE            w            no    -               -       save                          "Save the document"|"Saves the current document, or if it hasn't been saved yet, does a save as.\nThis can be done using a key binding or from within the command input."
  TREE            ?            no    -               -       show_help                     "Show this help"|"You can view the key bindings at any time (this help dialog).\nIt is driven by the commands.config so it is always in synch with your actual key bindings.\nThere are also more thorough help systems in the Scribbolyth Git repo."
  TREE            /            no    -               -       search_start                  "Search the tree"|"Displays the search dialog. This searches across all of the nodes in the document."
  TREE            \            no    -               -       search_results_start          "Search the tree and and create a results node"|"This search dialog functions exactly like the standard search, however upon hitting Enter it creates a 'search results' node.\nIf no node is currently selected this is created as a root node. Otherwise it is created as a child of the currently selected node."
  TREE            n            no    -               -       search_next                   "Jump to the next match"|"Not implemented."
  TREE            N            no    -               -       search_prev                   "Jump to the previous match"|"Not implemented"
  TREE            ]            yes   -               -       treeview_width_increase       "Widen the tree pane"|"Widens the tree panel. And this persists so when you open the file again, that width is restored.\n[count] [key binding] - repeats the action."
  TREE            [            yes   -               -       treeview_width_decrease       "Narrow the tree pane"|"Narrows the tree panel. And this persists so when you open the file again, that width is restored.\n[count] [key binding] - repeats the action."
  TREE            #            no    links           -       links                         "Open the links dialog"|"Displays the links dialog. Links can either be opened, using Enter, or copied to the clipboard, using 'y'."
  TREE            X            no    brklinks        -       show_broke_links              "Lists any broken links"|"The broken links that are shown in this dialog are inter-document links, not external URLs."
  TREE            m            no    bookmark        -       bookmark                      "Bookmark this node"|"Adds the currently selected node to the bookmarks list.\nThese are node-level bookmarks, they simply select the node."
  TREE            `            no    bookmarks       -       bookmarks                     "Show bookmarks"|"Displays the bookmarks dialog and the list of stored node and line-level bookmarks."
  TREE            <            no    -               -       history                       "Show history"|"Displays the history dialog. These are the historical list of recently viewed nodes.\nNote that empty nodes are not added to this list."
  TREE            o            no    o               prompt  open                          "Open a file..."|"Opening files is done within the Open File dialog or from the command input.\n\nNote:\nDirectories can be bookmarked using: m\nTo access bookmarked directories use: `"
  TREE            O            no    -               -       recents                       "Show recent files"|"Displays the recently opened / saved as files. Scribbolyth does not have a 'tabs' feature, however this dialog is designed to behave in a somewhat similar manner\nSee also the 'g t' key binding."
  TREE            u            no    -               -       undo                          "Undo last change"|"The undo dialog can be accessed from TREE mode, but be aware, if you navigate to a different node, the undo history is forgotten.\nIt only persists while the node remains the currently selected node."
  TREE            "g t"        no    -               -       open_prev                     "Opens the previously opened file"|"This key binding toggles between the two most recently opened or saved as files (in the recent files list)"
  TREE            Esc          no    -               -       deselect_node                 "Deselect the node"|"If Scribbolyth is already in TREE mode and the user hits Escape, the current node is deselected.\nThis allows the user to create root nodes using the new node key binding."
  
# ---- NORMAL mode ----------------------------------------------------------
# MODE            KEY          REP   CMD             ARGS    OP                            DESC
  NORMAL          ArrowUp      no    -               -       cursor_up                     "Move cursor up"
  NORMAL          ArrowDown    no    -               -       cursor_down                   "Move cursor down"
  NORMAL          ArrowLeft    no    -               -       cursor_left                   "Move cursor left"
  NORMAL          ArrowRight   no    -               -       cursor_right                  "Move cursor right"
  NORMAL          PageUp       no    -               -       cursor_page_up                "Scroll up 10 lines"
  NORMAL          PageDown     no    -               -       cursor_page_down              "Scroll down 10 lines"
  NORMAL          Home         no    -               -       cursor_line_start             "Jump to start of line"
  NORMAL          End          no    -               -       cursor_line_end               "Jump to end of line"
  NORMAL          h            yes   -               -       cursor_left                   "Move cursor left"|"Moves the cursor left within the currently selected node's contents.\n[count] [key binding] - repeats the action."
  NORMAL          j            yes   -               -       cursor_down                   "Move cursor down"|"Moves the cursor down within the currently selected node's contents.\n[count] [key binding] - repeats the action."
  NORMAL          k            yes   -               -       cursor_up                     "Move cursor up"|"Moves the cursor up within the currently selected node's contents.\n[count] [key binding] - repeats the action."
  NORMAL          J            yes   -               -       move_line_down                "Move the current line down"|"Moves the current line of text down within the currently selected node's contents.\n[count] [key binding] - repeats the action."
  NORMAL          K            yes   -               -       move_line_up                  "Move the current line up"|"Moves the current line of text up within the node's contents.\n[count] [key binding] - repeats the action."
  NORMAL          l            yes   -               -       cursor_right                  "Move cursor right"|"Moves the cursor right within the node's contents.\n[count] [key binding] - repeats the action."
  NORMAL          i            no    -               -       enter_insert                  "Enter INSERT mode before cursor"|"Enters INSERT mode with the cursor placed before the current location in the node's contents."
  NORMAL          a            no    -               -       enter_insert                  "Enter INSERT mode after cursor"|"Enters INSERT mode with the cursor placed after the current location in the node's contents."
  NORMAL          v            no    -               -       enter_visual                  "Start character selection"|"Enters VISUAL mode, allowing you to select text within the current node's contents."
  NORMAL          V            no    -               -       enter_visual_line             "Start line selection"|"Enters VISUAL LINE mode, allowing you to select entire lines of text within the current node's contents."
  NORMAL          CtrlV        no    -               -       enter_visual_block            "Start column (block) selection"|"Enters VISUAL BLOCK mode, allowing you to make 'block' selections within the current node's contents."
  NORMAL          CtrlDash     no    -               -       insert_rule                   "Insert an 80-dash rule (Ctrl+Shift+- if the terminal zooms)"|"This key combination inserts a horizontal line.\nNote that some terminals utilize Ctrl+- for zooming. If your terminal does this - use Ctrl+Shift+- to create the horizontal line."
  NORMAL          CtrlRBracket no    -               -       insert_link                   "Search nodes and insert a _Title_ link at the cursor (Ctrl+])"|"This key binding allows you to insert an inter-document link using a search dialog."
  NORMAL          CtrlL        no    -               -       follow_link                   "Follow the link under the cursor (Ctrl+l)"|"Place the cursor within a link in the current node's contents. Then press this key combination to navigate to that link."
  NORMAL          x            no    -               -       delete_char                   "Delete the character under the cursor"|"Deletes a single character, where the cursor is located within the current node's contents.\n[count] [key binding] - repeats the action."
  NORMAL          u            no    -               -       undo                          "Undo last change"|"This key binding displays the undo dialog, allowing you to navigate through the various changes you have made since selecting the current node. To apply the historical entry you are on hit Enter.\nEscape closes this dialog."
  NORMAL          y            no    -               -       yank                          "Copy the current line"|"Using this key binding allows you to copy an entire line of text without the need to select it."
  NORMAL          p            no    -               -       paste                         "Paste the clipboard"|"Pastes the clipboard contents where the cursor is currently located within the current node's contents."
  NORMAL          w            no    -               -       cursor_word_forward           "Jump to start of next word"|"This key binding moves the cursor to the next word, words are identified by the spaces that surround them.\n[count] [key binding] - repeats the action."
  NORMAL          e            yes   -               -       cursor_word_end               "Jump to end of word"|"Moves the cursor to the end of the word, so just before the next encountered space."
  NORMAL          b            yes   -               -       cursor_word_back              "Jump to start of previous word"|"Moves the cursor to the beginning of the previous word, as identified by the spaces that surround it.\n[count] [key binding] - repeats the action."
  NORMAL          0            no    -               -       cursor_line_start             "Jump to start of line"|"Moves the cursor to the start of the currently selected line within the current node's contents."
  NORMAL          $            no    -               -       cursor_line_end               "Jump to end of line"|"Moves the cursor to the end of the currently selected line within the current node's contents."
  NORMAL          G            no    -               -       cursor_file_end               "Jump to end of document"|"Moves the cursor to the end of the current node's contents."
  NORMAL          "d d"        yes   -               -       delete_line                   "Delete the current line"|"Deletes the entire line of text that is under the cursor.\n[count] [key binding] - repeats the action."
  NORMAL          D            no    -               -       delete_to_eol                 "Delete from the cursor to end of line"|"Deletes all of the text from where the cursor is to the end of that line of text."
  NORMAL          "g g"        no    -               -       cursor_file_start             "Jump to start of document"|"Moves the cursor to the first position in the first line of text within the currently selected node's contents."
  NORMAL          "d b"        yes   -               -       delete_word_back              "Delete to end of previous word"|"Deletes all the text from where the cursor is back to the start of the word it is positioned within, as identified by the spaces that surround the word.\n[count] [key binding] - repeats the action."
  NORMAL          "d w"        yes   -               -       delete_word_forward           "Delete to start of next word"|"Deletes from where the cursor is forward to the end of the word it is positioned within, as identified by the spaces that surround the word - and including the spaces after the word.\n[count] [key binding] - repeats the action."
  NORMAL          "d e"        yes   -               -       delete_word_end               "Delete to word end"|"Deletes the word the cursor is currently positioned within, but does NOT include the spaces that follow the word.\n[count] [key binding] - repeats the action."
  NORMAL          "d i w"      no    -               -       delete_word                   "Delete the inner word"|"Deletes the word that the cursor is currently sittin within."
  NORMAL          Esc          no    -               -       enter_tree                    "Return to the tree"|"Switches to TREE mode."
  NORMAL          m            no    bookmark        -       bookmark                      "Bookmark this node"|"Bookmarks the currently selected node.\nThis is a node bookmark, so it will simply select the node when invoked."
  NORMAL          M            no    -               cursor  bookmark                      "Bookmark the node under the cursor"|"Bookmarks the currently selected node AND the line that the cursor is currently positioned on.\nThis will select the node and move the cursor to the stored line value."
  NORMAL          `            no    bookmarks       -       bookmarks                     "Show bookmarks"|"Displays the bookmarks dialog. You can navigate among the bookmarks and Enter will select the bookmark you have highlighted. Escape will simply hide this dialog."
  NORMAL          :            no    -               -       enter_command                 "Open the command line"|"This key binding will display the command input and set the focus on it."
  NORMAL          /            no    -               -       enter_search                  "Find in the document"|"This key binding allows you to search within the contents of the currently selected node."
  NORMAL          \            no    -               -       search_results_start          "Search and collect every match into a new results node"|"This search dialog functions exactly like the standard search, however upon hitting Enter it creates a 'search results' node.\nIf no node is currently selected this is created as a root node. Otherwise it is created as a child of the currently selected node."
  NORMAL          *            no    -               -       search_word                   "Find the word under the cursor"|"Searches within the current node's contents, for the word that the cursor is currently positioned within."
  NORMAL          n            no    -               -       search_next                   "Jump to the next match"|"Once you have searched the current node's contents, this will move the cursor to the next matching text if any."
  NORMAL          N            no    -               -       search_prev                   "Jump to the previous match"|"Once you have searched the current node's contents, this will move the cursor to the previous matching text if any."
  NORMAL          Backspace    no    -               -       backspace_char                "Delete the character before the cursor"
  NORMAL          #            no    links           -       links                         "Open the links dialog"|"Displays the links dialog. Links can either be opened, using Enter, or copied to the clipboard, using 'y'."
  NORMAL          X            no    brklinks        -       show_broke_links              "Lists any broken links"|"Displays a dialog showing any broken inter-document links that exist within it."
  NORMAL          <            no    -               -       history                       "Show history"|"Displays the history dialog. These are the historical list of recently viewed nodes.\nNote that empty nodes are not added to this list."
  NORMAL          O            no    -               -       recents                       "Show recent files"|"Displays the recently opened / saved as files. Scribbolyth does not have a 'tabs' feature, however this dialog is designed to behave in a somewhat similar manner\nSee also the 'g t' key binding."
  NORMAL          S            no    saveas          prompt  saveas                        "Save the document as..."|"Save as is done within the command input.\nThis allows you to save the current file in a different location or with a different name.\n\nNote:\nDirectories can be bookmarked using: m\nTo access bookmarked directories use: `"
  NORMAL          R            no    replace         prompt  replace                       "Replace text in this node <old>/<new>"|"Displays the command input pre-populated with the :replace command. To replace text within the current node's contents enter the existing text, followed by '/' then the text to replace it with."
  NORMAL          Ctrl;        no    -               -       format_table                  "Create or re-format the table the cursor is in"|"If the cursor is positioned within text that is part of an ASCII table, this will update that table.\nTable dividers are defined by four dashes '----'\nTable columns are defined by pipes '|'\n\nExample:\n\n----\n|Caption 1|Caption 2|\n|Data Item 1|Data Item 2|\n----"
  
# ---- INSERT mode ----------------------------------------------------------
# MODE            KEY          REP   CMD             ARGS    OP                            DESC
  INSERT          Esc          no    -               -       enter_normal                  "Return to NORMAL mode"|"This key binding activates the NORMAL mode."
  INSERT          CtrlC        no    -               -       yank                          "Copy the current line"|"In INSERT mode text isn't selectable, but using this allows you to copy the line of text the cursor is currently on.\nTo copy individual characters, words, or selections of text, enter VISUAL mode."
  INSERT          CtrlX        no    -               -       cut                           "Cut the current line"|"In INSERT mode text isn't selectable, but using this allows you to cut the line of text the cursor is currently on.\nTo copy individual characters, words, or selections of text, enter VISUAL mode."
  INSERT          CtrlV        no    -               -       paste                         "Paste the clipboard"
  INSERT          CtrlDash     no    -               -       insert_rule                   "Insert an 80-dash rule (Ctrl+Shift+- if the terminal zooms)"|"This key combination inserts a horizontal line.\nNote that some terminals utilize Ctrl+- for zooming. If your terminal does this - use Ctrl+Shift+- to create the horizontal line."
  INSERT          CtrlRBracket no    -               -       insert_link                   "Search nodes and insert a _Title_ link at the cursor (Ctrl+])"|"This key binding allows you to insert an inter-document link using a search dialog."
  INSERT          Return       no    -               -       insert_newline                "Insert a new line"
  INSERT          Backspace    no    -               -       backspace_char                "Delete the character before the cursor"
  INSERT          Tab          no    -               -       insert_tab                    "Insert a tab"
  INSERT          ArrowUp      no    -               -       cursor_up                     "Move cursor up"
  INSERT          ArrowDown    no    -               -       cursor_down                   "Move cursor down"
  INSERT          ArrowLeft    no    -               -       cursor_left                   "Move cursor left"
  INSERT          ArrowRight   no    -               -       cursor_right                  "Move cursor right"
  INSERT          Home         no    -               -       cursor_line_start             "Jump to start of line"
  INSERT          End          no    -               -       cursor_line_end               "Jump to end of line"
  INSERT          CtrlArrowLeft  no  -               -       cursor_word_back              "Move cursor to previous word"
  INSERT          CtrlArrowRight no -               -       cursor_word_forward            "Move cursor to next word"
  
# ---- VISUAL mode ----------------------------------------------------------
# MODE            KEY          REP   CMD             ARGS    OP                            DESC
  VISUAL          ArrowUp      no    -               -       cursor_up                     "Extend selection up"
  VISUAL          ArrowDown    no    -               -       cursor_down                   "Extend selection down"
  VISUAL          ArrowLeft    no    -               -       cursor_left                   "Extend selection left"
  VISUAL          ArrowRight   no    -               -       cursor_right                  "Extend selection right"
  VISUAL          h            yes   -               -       cursor_left                   "Extend selection left"|"Extends the current selection to the left.\n[count] [key binding] - repeats the action."
  VISUAL          j            yes   -               -       cursor_down                   "Extend selection down"|"Extends the current selection down to the next row of text.\n[count] [key binding] - repeats the action."
  VISUAL          k            yes   -               -       cursor_up                     "Extend selection up"|"Extends the current selection up to the previous row of text.\n[count] [key binding] - repeats the action."
  VISUAL          l            yes   -               -       cursor_right                  "Extend selection right"|"Extends the current selection to the right.\n[count] [key binding] - repeats the action."
  VISUAL          "i w"        no    -               -       select_word                   "Select the word under the cursor"|"Selects the word that the cursor is within, as identified by the spaces that surround it.\n[count] [key binding] - repeats the action."
  VISUAL          w            yes   -               -       cursor_word_forward           "Extend selection to next word"|"Extends the selection to the next word, words are identified by the spaces that surround them.\n[count] [key binding] - repeats the action."
  VISUAL          e            yes   -               -       cursor_word_end               "Extend selection to end of word"|"Extends the selection to the end of the word the cursor is currently within, words are identified by the spaces that surround them.\n[count] [key binding] - repeats the action."
  VISUAL          b            yes   -               -       cursor_word_back              "Extend selection to previous word"|"Extends the selection to the previous word, words are identified by the spaces that surround them.\n[count] [key binding] - repeats the action."
  VISUAL          "g g"        no    -               -       cursor_file_start             "Extend selection to document start"|"Extends the selection to the first position in the first row of the current node's contents."
  VISUAL          G            no    -               -       cursor_file_end               "Extend selection to document end"|"Extends the selection to the last position in the last row of the current node's contents."
  VISUAL          0            no    -               -       cursor_line_start             "Jump to start of line"|"Extends the selection to the first position in the row the cursor is currently on."
  VISUAL          $            no    -               -       cursor_line_end               "Jump to end of line"|"Extends the selection to the last position in the row the cursor is currently on."
  VISUAL          y            no    -               -       yank                          "Copy the selection"
  VISUAL          p            no    -               -       paste                         "Paste the clipboard, replacing the selection"
  VISUAL          x            no    -               -       cut                           "Cut the selection"
  VISUAL          d            no    -               -       delete_selection              "Delete the selection"
  VISUAL          D            no    -               -       delete_line                   "Delete the selected lines"
  VISUAL          U            no    -               -       upper_selection               "Selection to upper case"
  VISUAL          u            no    -               -       lower_selection               "Selection to lower case"
  VISUAL          R            no    replace         prompt  replace                       "Replace in the selection <old>/<new>"|"Text replace is done in the command input."
  VISUAL          Esc          no    -               -       enter_normal                  "Cancel the selection"|"Switch to NORMAL mode."
  VISUAL          :            no    -               -       enter_command                 "Open the command line"|"Display the command input and give it focus."
  VISUAL          Ctrl;        no    -               -       format_table                  "Format the table in the selection"|"If the cursor is positioned within text that is part of an ASCII table or the current selection contains only an ASCII table (if the entire table isn't selected, the results may not be as expected), this will update that table.\nTable dividers are defined by four dashes '----'\nTable columns are defined by pipes '|'\n\nExample:\n\n----\n|Caption 1|Caption 2|\n|Data Item 1|Data Item 2|\n----"
  VISUAL          >            yes   -               -       indent                        "Indents the selected lines"|"Indents the selected lines by one tab (four spaces)."
  
# ---- VISUAL BLOCK mode (Ctrl+V: column/rectangle selection) ---------------
# MODE            KEY          REP   CMD             ARGS    OP                            DESC
  VISUAL_BLOCK    ArrowUp      no    -               -       cursor_up                     "Extend block up"
  VISUAL_BLOCK    ArrowDown    no    -               -       cursor_down                   "Extend block down"
  VISUAL_BLOCK    ArrowLeft    no    -               -       cursor_left                   "Narrow block left"
  VISUAL_BLOCK    ArrowRight   no    -               -       cursor_right                  "Widen block right"
  VISUAL_BLOCK    k            yes   -               -       cursor_up                     "Extend block up"|"Extends the block selection up to previous row(s) of text\n[count] [key binding] - repeats the action."
  VISUAL_BLOCK    j            yes   -               -       cursor_down                   "Extend block down"|"Extends the block selection up to previous row(s) of text\n[count] [key binding] - repeats the action."
  VISUAL_BLOCK    h            yes   -               -       cursor_left                   "Narrow block left"|"Extends the block selection to the left.\n[count] [key binding] - repeats the action."
  VISUAL_BLOCK    l            yes   -               -       cursor_right                  "Widen block right"|"Extends the block selection to the right.\n[count] [key binding] - repeats the action."
  VISUAL_BLOCK    w            yes   -               -       cursor_word_forward           "Move right edge to next word"|"Extends the block selection to the next word, words are identified by the spaces that surround them.\n[count] [key binding] - repeats the action."
  VISUAL_BLOCK    b            yes   -               -       cursor_word_back              "Move left edge to previous word"|"Extends the block selection to the previous word, words are identified by the spaces that surround them.\n[count] [key binding] - repeats the action."
  VISUAL_BLOCK    e            yes   -               -       cursor_word_end               "Move right edge to word end"|"Extends the block selection to the end of the word the cursor is currently within, words are identified by the spaces that surround them.\n[count] [key binding] - repeats the action."
  VISUAL_BLOCK    0            no    -               -       cursor_line_start             "Move left edge to column 0"|"Extends the block selection to the first position in the row the cursor is currently on."
  VISUAL_BLOCK    $            no    -               -       block_to_eol                  "Widen block to end of line"|"Extends the block selection to the last position in the row the cursor is currently on."
  VISUAL_BLOCK    "g g"        no    -               -       block_file_start              "Extend block to document start"|"Extends the block selection to the first position in the first row of the current node's contents."
  VISUAL_BLOCK    G            no    -               -       block_file_end                "Extend block to document end"|"Extends the block selection to the last position in the last row of the current node's contents."
  VISUAL_BLOCK    PageUp       yes   -               -       cursor_page_up                "Extend block up 10 lines"
  VISUAL_BLOCK    PageDown     yes   -               -       cursor_page_down              "Extend block down 10 lines"
  VISUAL_BLOCK    d            no    -               -       delete_selection              "Delete the block"
  VISUAL_BLOCK    x            no    -               -       delete_selection              "Delete the block"
  VISUAL_BLOCK    y            no    -               -       yank                          "Copy the block"
  VISUAL_BLOCK    p            no    -               -       paste                         "Paste the clipboard, replacing the block"
  VISUAL_BLOCK    U            no    -               -       upper_selection               "Block to upper case"
  VISUAL_BLOCK    u            no    -               -       lower_selection               "Block to lower case"
  VISUAL_BLOCK    I            no    -               -       block_insert_start            "Insert text at block start"|"Enters INSERT mode on the block selection, at the start of the lines, entered text is applied to the block selection upon hitting Escape."
  VISUAL_BLOCK    A            no    -               -       block_insert_end              "Insert text at block end"|"Enters INSERT mode on the block seelction, at the end of the lines, entered text is applied to the block selection upon hitting Escape."
  VISUAL_BLOCK    R            no    replace         prompt  replace                       "Replace in the block <old>/<new>"|"Text replace is done in the command input."
  VISUAL_BLOCK    Esc          no    -               -       enter_normal                  "Cancel the block, apply changes"|"Cancels VISUAL BLOCK mode and applies the changes that were made."
  
