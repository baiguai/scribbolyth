# scribbolyth keymap & command configuration
#
# One entry per line:  mode  key  repeat  command  args  op  function
#
#   mode     TREE | NORMAL | INSERT | VISUAL  binds `key` in that mode.
#            GLOBAL                           registers a command only (no key).
#
#   key      a single character (j, :, 0, $), a special token
#            (Esc, Return, Tab, Backspace, Space,
#             ArrowUp, ArrowDown, ArrowLeft, ArrowRight,
#             PageUp, PageDown, Home, End), or a quoted multi-key
#            sequence like "g g".  '-' means no key binding.
#
#   repeat   yes | no  whether the key accepts a count prefix (3 j).
#
#   command  optional ':name' usable from the command line.
#            '-' means the entry has no command-line access.
#            When args is 'prompt', this name is also what gets
#            prepopulated in the command field when the key is pressed.
#
#   args     -         no arguments are passed.
#            prompt    the key opens the command line with ':command '
#                      already typed so you can enter the arguments.
#                      Requires `command` to be set.
#            <text>    passed verbatim to the function.
#
#   op       the operation name the loader dispatches on.  If `command`
#            is '-', the operation is reachable ONLY through the key; if
#            `command` is set, it can also be run as ':command [args]'.
#
#   function the ACTUAL function invoked when this entry triggers.
#            '-' means the behaviour is not implemented yet.
#
# Lines starting with '#' and blank lines are ignored.

# ---- TREE mode ------------------------------------------------------------
TREE   ArrowUp      yes   -            -        move_up            MoveSelection(-1)
TREE   ArrowDown    yes   -            -        move_down          MoveSelection(+1)
TREE   k            yes   -            -        move_up            MoveSelection(-1)
TREE   j            yes   -            -        move_down          MoveSelection(+1)
TREE   G            no    -            -        move_file_end      MoveToEnd()
TREE   "g g"        no    -            -        move_file_start    MoveToStart()
TREE   Return       yes   -            -        tree_open          OpenSelected()
TREE   h            yes   -            -        tree_collapse      CollapseSelected()
TREE   l            yes   -            -        tree_expand        ExpandSelected()
TREE   E            no    -            -        expand_all         ExpandAll()
TREE   C            no    -            -        collapse_all       CollapseAll()
TREE   A            no    create_folder prompt   new_folder        InsertFolder(name)
TREE   a            no    create_note   prompt   new_note          InsertNote(name)
TREE   R            no    rename        prompt   rename_node       RenameSelected(name)
TREE   i            no    -            -        enter_normal       EnterNormal()
TREE   I            no    -            -        enter_insert       EnterInsert()
TREE   :            no    -            -        enter_command      OpenCommandLine()
TREE   J            yes   -            -        move_node_down     MoveNode(+1)
TREE   K            yes   -            -        move_node_up       MoveNode(-1)
TREE   H            yes   -            -        move_parent_up     MoveParent(-1)
TREE   L            yes   -            -        move_parent_down   MoveParent(+1)

# ---- NORMAL mode ----------------------------------------------------------
NORMAL ArrowUp      no  -  -  move_up          -
NORMAL ArrowDown    no  -  -  move_down        -
NORMAL ArrowLeft    no  -  -  move_left        -
NORMAL ArrowRight   no  -  -  move_right       -
NORMAL PageUp       no  -  -  move_page_up     -
NORMAL PageDown     no  -  -  move_page_down   -
NORMAL Home         no  -  -  move_line_start  -
NORMAL End          no  -  -  move_line_end    -
NORMAL h            no  -  -  move_left        -
NORMAL j            no  -  -  move_down        -
NORMAL k            no  -  -  move_up          -
NORMAL l            no  -  -  move_right       -
NORMAL i            no  -  -  enter_insert     EnterInsert()
NORMAL v            no  -  -  enter_visual     EnterVisual()
NORMAL V            no  -  -  enter_visual_line EnterVisualLine()
NORMAL x            no  -  -  delete_char      -
NORMAL u            no  -  -  undo             -
NORMAL y            no  -  -  yank             -
NORMAL p            no  -  -  paste            -
NORMAL w            no  -  -  move_word_forward -
NORMAL b            no  -  -  move_word_back   -
NORMAL 0            no  -  -  move_line_start  -
NORMAL $            no  -  -  move_line_end    -
NORMAL G            no  -  -  move_file_end    -
NORMAL d            no  -  -  delete_line      -
NORMAL D            no  -  -  delete_line      -
NORMAL "g g"        no  -  -  move_file_start  -
NORMAL "d d"        no  -  -  delete_line      -
NORMAL Esc          no  -  -  enter_tree       EnterTree()
NORMAL :            no  -  -  enter_command    OpenCommandLine()
NORMAL Backspace    no  -  -  backspace_char   -

# ---- INSERT mode ----------------------------------------------------------
INSERT Esc          no  -  -  enter_normal     EnterNormal()
INSERT Return       no  -  -  insert_newline   -
INSERT Backspace    no  -  -  backspace_char   -
INSERT Tab          no  -  -  insert_tab       -

# ---- VISUAL mode ----------------------------------------------------------
VISUAL ArrowUp      no  -  -  move_up          -
VISUAL ArrowDown    no  -  -  move_down        -
VISUAL ArrowLeft    no  -  -  move_left        -
VISUAL ArrowRight   no  -  -  move_right       -
VISUAL h            no  -  -  move_left        -
VISUAL j            no  -  -  move_down        -
VISUAL k            no  -  -  move_up          -
VISUAL l            no  -  -  move_right       -
VISUAL y            no  -  -  yank             -
VISUAL d            no  -  -  delete_line      -
VISUAL D            no  -  -  delete_line      -
VISUAL Esc          no  -  -  enter_normal     EnterNormal()
VISUAL :            no  -  -  enter_command    OpenCommandLine()

# ---- GLOBAL commands (no key binding) -------------------------------------
GLOBAL  -           -   qa  -        quit            Quit()
