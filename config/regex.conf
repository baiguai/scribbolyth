#
# REGEX CHEAT SHEET
#
# One entry per line:  CATEGORY  PATTERN  EXAMPLE  "DESCRIPTION"
#   * CATEGORY and PATTERN are single tokens (no spaces).
#   * EXAMPLE and DESCRIPTION may contain spaces if wrapped in quotes.
#   * Lines starting with '#' are comments. Edit or extend this file freely.
#
# This app runs an ECMAScript-flavoured engine (std::regex) and makes
# searches always case-insensitive. Not every PCRE/JS feature is supported:

Anchors       ^                  "^Hello"          "Start of a line (escape as \^ to match a literal ^)"
Anchors       $                  "world$"          "End of a line (escape as \$ to match a literal $)"
Anchors       \b                 "\bword\b"        "Word boundary: between a word and a non-word character"
Anchors       \B                 "\Bmiddle\B"      "Not a word boundary"

Classes       .                  "a.c"             "Any character except a line terminator"
Classes       \d                 "\d{4}"           "A digit: [0-9]"
Classes       \D                 "\D+"             "Not a digit"
Classes       \w                 "\w+"             "A word character: [A-Za-z0-9_]"
Classes       \W                 "\W"              "Not a word character"
Classes       \s                 "\s"              "A whitespace character (space, tab, newline)"
Classes       \S                 "\S+"             "Not a whitespace character"
Classes       [abc]              "[abc]"           "Any one of a, b or c"
Classes       [^abc]             "[^abc]"          "Any character EXCEPT a, b or c"
Classes       [a-z]              "[a-z0-9]"        "A range: any character from a to z"
Classes       \n                 "\n"              "Newline character escape"
Classes       \t                 "\t"              "Tab character escape"

Quantifiers   *                  "ab*"             "0 or more of the preceding atom"
Quantifiers   +                  "ab+"             "1 or more of the preceding atom"
Quantifiers   ?                  "ab?"             "0 or 1 (optional) of the preceding atom"
Quantifiers   {n}                "\d{4}"           "Exactly n of the preceding atom"
Quantifiers   {n,}               "\d{2,}"          "n or more of the preceding atom"
Quantifiers   {n,m}              "\d{2,4}"         "Between n and m of the preceding atom"
Quantifiers   *?                 "ab*?"            "Lazy * and +: match as few characters as possible"

Groups        (...)              "(ab)+"           "Capturing group: groups atoms and captures the match"
Groups        (?:...)            "(?:ab)+"         "Non-capturing group: groups without capturing"
Groups        (?<name>...)       "(?<year>\d{4})"  "Named capturing group"
Groups        \1                 "(\w)\1"          "Backreference: matches what the 1st group captured"
Groups        |                  "cat|dog"         "Alternation: match either side (like OR)"

Lookaround    (?=...)            "x(?=y)"          "(?=.*hello)(?=.*world)  Matches 'hello' and 'world' any order"
Lookaround    (?!...)            "x(?!y)"          "Negative lookahead."

Notes         r:                 "r:\d+"           "In Search, prefix a query with r: to run it as a regex"
Notes         r:                 "r:^TODO"         "Use ^ to anchor a regex search to the start of a line"
Notes         \                  "\."              "Escape a special character: \. is a literal dot"
